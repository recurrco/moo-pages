<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>MOO Pages</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FFF8ED;
      color: #333;
      min-height: 100vh;
      padding: 48px 24px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    header { margin-bottom: 40px; }
    h1 {
      font-family: 'Bebas Neue', -apple-system, sans-serif;
      font-size: 40px;
      letter-spacing: 0.02em;
    }
    header p { color: #777; font-size: 14px; margin-top: 6px; }
    .pages { list-style: none; }
    .pages li {
      border: 2px solid #333;
      border-radius: 12px;
      margin-bottom: 12px;
      background: #fff;
    }
    .pages a {
      display: block;
      padding: 16px 20px;
      text-decoration: none;
      color: #333;
      font-weight: 600;
      font-size: 15px;
    }
    .pages a:hover { background: #FFE100; }
    .pages .desc { display: block; font-weight: 400; color: #777; font-size: 13px; margin-top: 4px; }
    .empty { color: #999; font-size: 14px; padding: 24px 0; }
    footer { margin-top: 48px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>MOO Pages</h1>
      <p>pages.moo.kitchen — internal listing. Individual pages below are shareable by direct link; this index is not public.</p>
    </header>
    <ul class="pages">
      <!-- Add one <li> per page:
      <li><a href="/slug/">Page Title<span class="desc">One-line description</span></a></li>
      -->
    </ul>
    <p class="empty">No pages yet — this list updates as pages are added.</p>
    <footer>Ministry of Oats · internal</footer>
  </div>
</body>
</html>
